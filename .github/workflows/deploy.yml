name: Deploy

# Manual only: nothing is built or deployed until someone presses
# "Run workflow" in the Actions tab. See README, "Deploying to Azure".
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest -q

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push the image to GitHub Container Registry
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # Built-in token, valid only for this run. No personal token is stored.
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # Tagged with the commit, so every deployment is traceable and a bad
          # one can be rolled back by redeploying an earlier commit.
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # lets GitHub prove its identity to Azure (OIDC)
    steps:
      # OIDC login: Azure trusts this repository directly, so no Azure password
      # or long-lived key is stored in GitHub. These three values are identifiers,
      # not secrets, but are kept as repository secrets to avoid publishing them.
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      # Only the image changes. Secrets (Garmin key, signing key, GitHub client
      # secret) live in the Container App and are never seen by this workflow.
      - run: >
          az containerapp update
          --name "${{ vars.AZURE_CONTAINER_APP }}"
          --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}"
          --image "${{ env.IMAGE }}:${{ github.sha }}"
